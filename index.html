<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integral por Sustitución</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg, #0F172A, #1E3A8A, #2563EB);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.15);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
    font-size:32px;
}

.info{
    background: rgba(255,255,255,0.1);
    border-radius:15px;
    padding:15px;
    color:#E0F2FE;
    margin-bottom:20px;
    line-height:1.8;
}

input{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    font-size:20px;
    outline:none;
    background: rgba(255,255,255,0.9);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
}

button{
    width:100%;
    margin-top:20px;
    padding:18px;
    border:none;
    border-radius:18px;
    background: linear-gradient(90deg, #38BDF8, #2563EB);
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 6px 20px rgba(37,99,235,0.4);
}

button:hover{
    transform: translateY(-3px);
    box-shadow:0 10px 25px rgba(37,99,235,0.6);
}

#resultado{
    margin-top:25px;
    background: rgba(255,255,255,0.9);
    border-radius:20px;
    padding:25px;
    white-space:pre-wrap;
    line-height:1.9;
    font-size:18px;
    color:#0F172A;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}
</style>
</head>
<body>

<div class="container">
    <h1>🔵 Calculadora Integral por Sustitución/JEREMY</h1>

    <div class="info">
        <strong>Ejemplos:</strong><br>
        • 2x(x^2+1)^3<br>
        • 5x(x^2+4)^2
    </div>

    <input type="text" id="integral"
    placeholder="Ejemplo: 2x(x^2+1)^3">

    <button onclick="resolverIntegral()">
        Resolver Integral
    </button>

    <div id="resultado"></div>
</div>

<script>
function resolverIntegral(){

    let entrada =
    document.getElementById('integral').value.trim();

    let resultado =
    document.getElementById('resultado');

    resultado.innerHTML = "";

    const regex =
    /^([0-9]+)?x\((x\^([0-9]+)([+-][0-9]+))\)\^([0-9]+)$/;

    let match = entrada.match(regex);

    if(!match){
        resultado.innerHTML =
        "❌ No pude reconocer la integral.\nUsa algo como:\n2x(x^2+1)^3";
        return;
    }

    let coeficiente = parseInt(match[1]) || 1;
    let uCompleta = match[2];
    let potenciaX = parseInt(match[3]);
    let potenciaExterior = parseInt(match[5]);

    let nuevaPotencia = potenciaExterior + 1;

    let numerador = coeficiente;
    let denominador = potenciaX * nuevaPotencia;

    function mcd(a,b){
        return b === 0 ? a : mcd(b, a % b);
    }

    let divisorComun =
    mcd(numerador, denominador);

    numerador /= divisorComun;
    denominador /= divisorComun;

    let fraccionFinal =
    denominador === 1
    ? `${numerador}`
    : `${numerador}/${denominador}`;

    let texto = `
🔹 INTEGRAL

∫ ${entrada} dx

━━━━━━━━━━━━━━━━━━

1) Identificación de u

u = ${uCompleta}

━━━━━━━━━━━━━━━━━━

2) Derivada de u

du = ${potenciaX}x dx

━━━━━━━━━━━━━━━━━━

3) Sustitución

= ∫ (${coeficiente}/${potenciaX})u^${potenciaExterior} du

━━━━━━━━━━━━━━━━━━

4) Fórmula usada

∫u^n du = u^(n+1)/(n+1)

━━━━━━━━━━━━━━━━━━

5) Resultado

(${fraccionFinal})(${uCompleta})^${nuevaPotencia} + C
`;

    resultado.textContent = texto;
}
</script>

</body>
</html>
